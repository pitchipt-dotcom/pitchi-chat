[project]
license = "MIT"
name = "pitch-chat"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "jsonschema>=4.23,<5", "Pillow>=11,<13", "referencing>=0.36,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
